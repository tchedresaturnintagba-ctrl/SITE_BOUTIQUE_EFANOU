services:
  postgres:
    image: postgres:17-alpine
    container_name: horizon-efanou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "Boutique_Horizon Efanou"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - horizon_efanou_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d horizon_efanou"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  horizon_efanou_data: